[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cc-energy"
description = "Fast energy estimates for Claude Code transcripts (ready-reckoner model)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/matweldon/cc-energy"

[tool.maturin]
bindings = "bin"
strip = true
