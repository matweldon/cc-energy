[package]
name = "cc-energy"
version = "0.1.0"
edition = "2021"
description = "Fast energy estimates for Claude Code transcripts (ready-reckoner model)"
license = "MIT"
repository = "https://github.com/matweldon/cc-energy"
homepage = "https://github.com/matweldon/cc-energy"
readme = "README.md"
keywords = ["claude", "energy", "llm", "carbon", "claude-code"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
